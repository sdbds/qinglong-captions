name: Tests

on:
  push:
    branches: [main]
    paths:
      - "module/**"
      - "gui/**"
      - "utils/**"
      - "config/**"
      - "tests/**"
      - "tools/**"
      - "third_party/**"
      - "*.ps1"
      - "*.sh"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "module/**"
      - "gui/**"
      - "utils/**"
      - "config/**"
      - "tests/**"
      - "tools/**"
      - "third_party/**"
      - "*.ps1"
      - "*.sh"
      - ".github/scripts/**"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

env:
  HF_HOME: huggingface
  XFORMERS_FORCE_DISABLE_TRITON: "1"
  UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  UV_NO_BUILD_ISOLATION: "1"
  UV_NO_CACHE: "0"
  UV_LINK_MODE: symlink
  UV_INDEX_STRATEGY: unsafe-best-match
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  full-unit:
    runs-on: ${{ matrix.os }}
    # The deterministic CPU rig/renderer tests run before the rest of the offline suite.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install declared test environment
        shell: pwsh
        run: .github/scripts/setup_ci_test_env.ps1

      - name: Run authoritative offline unit suite
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m pytest tests -q --strict-markers -m "not optional_runtime and not gpu and not network" --durations=25

  provider-v2:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install declared test environment
        shell: pwsh
        run: .github/scripts/setup_ci_test_env.ps1

      - name: Run strict provider discovery gate
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -c "from module.providers.registry import get_registry; reg = get_registry(); reg.discover(strict=True)"

      - name: Run Provider V2 suite
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m pytest tests/test_provider_v2.py tests/test_provider_registry.py tests/test_provider_routes.py tests/test_api_handler_v2.py -q --durations=20

  compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install declared test environment
        shell: pwsh
        run: .github/scripts/setup_ci_test_env.ps1

      - name: Run compatibility smoke suite
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m pytest tests -q --strict-markers -m compat

  static-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install lightweight lint environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $RunnerPython = (Get-Command python).Source
          uv venv --python $RunnerPython
          if ($LASTEXITCODE -ne 0) { throw "uv venv failed" }
          $PythonExe = (Resolve-Path "./.venv/bin/python").Path
          $LintReqs = Join-Path $env:RUNNER_TEMP "qinglong-ci-lint-requirements.txt"
          python -c "import pathlib, sys, tomllib; deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['dependency-groups']['lint']; pathlib.Path(sys.argv[1]).write_text('\n'.join(deps) + '\n', encoding='utf-8')" "$LintReqs"
          if ($LASTEXITCODE -ne 0) { throw "extract lint requirements failed" }
          uv pip install --python $PythonExe -r $LintReqs
          if ($LASTEXITCODE -ne 0) { throw "uv pip install lint group failed" }
          "VENV_PYTHON=$PythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Python sources
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m compileall -q module gui utils config tests tools .github/scripts

      - name: Reject definite undefined names
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m ruff check module gui utils config tests tools .github/scripts --select F821,F823

      - name: Verify CI and static isolation contracts
        shell: pwsh
        run: |
          & $env:VENV_PYTHON -m pytest tests/test_test_workflow.py tests/test_test_isolation_contract.py::test_ordinary_tests_do_not_mutate_import_state_at_module_scope -q --strict-markers --noconftest
